# Conflict Early Warning System Configuration
project:
  id: conflict-early-warning
  name: "Conflict Early Warning System"
  description: "Predictive conflict scoring using climate, economic, and political indicators."

openrouter:
  model: "openrouter/free"
  fallback_model: "openrouter/free"

gdelt_query: "conflict violence protest instability"
include_forex: true

sources:
  - name: "GDELT"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
