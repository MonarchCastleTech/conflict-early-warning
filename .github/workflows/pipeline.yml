name: CEW data refresh and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: conflict-early-warning-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run quality gates
        run: python -m pytest -q

      - name: Refresh public data
        if: github.event_name != 'push'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python pipeline/conflict_early_warning_pipeline.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mct-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh ${GITHUB_RUN_ID} [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" = 5 ]; then
                echo "Push failed after five attempts" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Validate product identity
        run: |
          test -s assets/product-logo.svg
          grep -q 'assets/product-logo.svg' index.html
          ! grep -q '#2dd4bf' assets/product-logo.svg

      - name: Assemble static site
        run: |
          mkdir -p public
          cp index.html .nojekyll public/
          cp -R assets data public/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry delayed Pages activation
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
